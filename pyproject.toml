[project]
name = "delivery-hub"
version = "1.0.0"
description = "Food delivery backend: FastAPI, PostgreSQL, Redis, RabbitMQ, CQRS"
requires-python = ">=3.13"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "B",        # bugbear: likely bugs
    "UP",       # modern Python syntax
    "SIM",      # simplifications
    "ASYNC",    # async pitfalls
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
